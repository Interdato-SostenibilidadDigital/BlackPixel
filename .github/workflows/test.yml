name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chrome system dependencies
        # --install-deps necesita root; el caché compartido evita descargar Chrome otra vez.
        run: sudo "$(command -v node)" node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome --install-deps
      - run: npm test
